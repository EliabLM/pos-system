packages:
  # pos-system-client is tracked in this git repo but stays self-managed by its own
  # pnpm-lock.yaml during the strangler-fig migration. Fase 5 absorbs it into the
  # workspace once its server actions/Prisma are fully extracted.
  - 'pos-system-server'
  - 'pos-system-app'
  - 'packages/*'

# Prisma necesita correr sus postinstall (descarga de engines) — sin esto el
# CLI intentaría bajarlos on-demand en runtime (p. ej. `migrate deploy` al
# arrancar el contenedor del server).
onlyBuiltDependencies:
  - prisma
  - '@prisma/engines'
