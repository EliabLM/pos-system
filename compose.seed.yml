# Base descartable exclusiva para datos sintéticos; no usa el volumen del stack.
name: pos-seed
services:
  seed-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pos_seed
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - seed-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d pos_seed']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  seed-data:
