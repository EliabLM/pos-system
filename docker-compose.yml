# docker-compose para pruebas LOCALES del monorepo.
# Un solo `docker compose up` levanta: Postgres + server (Express) + client (Next.js) + app (Expo web).
#
# Servicios y puertos (host:container):
#   db       5432:5432   Postgres 17
#   server   3001:3001   pos-system-server (Express)   — aplica migraciones Prisma al arrancar (dueño del schema desde Fase 1)
#   client   3000:3000   pos-system-client (Next.js)   — espera al server healthy (migraciones ya aplicadas)
#   app      8082:8082   pos-system-app (Expo web)     — opcional, ver nota
#
# Cómo correrlo:
#   1. cp .env.example .env   (y ajusta CLIENT_AUTH_SECRET si quieres)
#   2. docker compose up --build
#
# Nota sobre la app móvil: Expo en docker solo sirve el bundle WEB. Para probar en
# dispositivo/emulador corre `pnpm start` fuera de docker con EXPO_PUBLIC_API_URL
# apuntando al server. Si no necesitas la app web ahora, podés omitirla:
#   docker compose up db server client

name: pos-system

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./pos-system-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      # Sin dominio todavia (Fase 2). JWT_SECRET queda opcional en el schema.
      JWT_SECRET: ${SERVER_JWT_SECRET:-}
      # Fase 1: el server es dueño del schema Prisma y aplica `migrate deploy`
      # en su entrypoint antes de levantar el proceso.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${POSTGRES_DB:-pos}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${POSTGRES_DB:-pos}?schema=public"
    ports:
      - "3001:3001"
    healthcheck:
      # El healthcheck marca healthy recien cuando las migraciones ya corrieron
      # (el proceso solo escucha despues de `migrate deploy`).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  client:
    build:
      # Contexto raíz: el Dockerfile necesita pos-system-client/ + el schema
      # Prisma que ahora vive en pos-system-server/prisma/ (Fase 1).
      context: .
      dockerfile: pos-system-client/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # El server aplica las migraciones; el client arranca cuando ya corrieron.
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Next.js
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Prisma — mismo DB local, sin pooling. Migrations las aplica el server.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${POSTGRES_DB:-pos}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${POSTGRES_DB:-pos}?schema=public"
      # Auth (Better Auth, #19)
      BETTER_AUTH_SECRET: ${CLIENT_AUTH_SECRET}
      BETTER_AUTH_URL: ${CLIENT_AUTH_URL:-http://localhost:3000}
      HTTPS_ENABLED: "false"
      # Imágenes de producto en un volumen persistente
      UPLOADS_DIR: /app/uploads
      MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-5}
      # Cuando Fase 2 exponga la API, aca ira NEXT_PUBLIC_API_URL apuntando al server.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"

  app:
    build:
      context: ./pos-system-app
      dockerfile: Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "8082:8082"

volumes:
  pgdata:
  uploads: